name: リカバリーマスター 自動記事生成

on:
  schedule:
    # 毎日 JST 12:00 (UTC 3:00)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: blog_engineをチェックアウト
        uses: actions/checkout@v4
        with:
          repository: MuscleLove-777/blog-engine
          path: blog_engine
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: pip install -r blog_engine/requirements.txt

      - name: 記事を自動生成してサイトをビルド
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_and_build.py
          echo "generated=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: API制限時はスキップ
        if: steps.generate.outputs.generated != 'true'
        run: |
          echo "::warning::記事生成をスキップしました（APIクォータ制限の可能性）"
          echo "次回のスケジュール実行で再試行されます"

      - name: 生成した記事をコミット
        if: steps.generate.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "記事自動生成: $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: GitHub Pages にデプロイ
        if: steps.generate.outputs.generated == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/site
          publish_branch: gh-pages
